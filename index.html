<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A live e-commerce wishlist app with persistent saves, built with Firebase and a public product API.">
    <title>WishCart — Save what you love</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    
    <!-- Open Graph & Social Meta Tags -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://e-commerce-wishlist.vercel.app/">
    <meta property="og:title" content="WishCart — E-Commerce Wishlist App">
    <meta property="og:description" content="A live e-commerce wishlist app with persistent saves, built with Firebase and a public product API.">
    <meta property="og:image" content="https://e-commerce-wishlist.vercel.app/og-image.svg">
    <meta property="og:image:type" content="image/svg+xml">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="WishCart — E-Commerce Wishlist App">
    <meta name="twitter:description" content="A live e-commerce wishlist app with persistent saves, built with Firebase and a public product API.">
    <meta name="twitter:image" content="https://e-commerce-wishlist.vercel.app/og-image.svg">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Stylesheet -->
    <link rel="stylesheet" href="styles.css">
    <!-- Theme: apply before first paint to prevent flash -->
    <script>
        (function () {
            var saved = localStorage.getItem('theme');
            var theme = saved || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
</head>
<body>
    <div class="app-container">
        <!-- App Header -->
        <header class="app-header">
            <div class="header-inner">
                <div class="brand">
                    <div class="brand-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/>
                        </svg>
                    </div>
                    <h1 class="app-title">Wishlist App</h1>
                </div>

                <!-- Navigation Tabs -->
                <nav class="nav-tabs" aria-label="Main Navigation">
                    <button class="tab-btn active" id="tab-products" data-tab="products" role="tab" aria-selected="true" aria-controls="content-area">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect width="7" height="7" x="3" y="3" rx="1"/>
                            <rect width="7" height="7" x="14" y="3" rx="1"/>
                            <rect width="7" height="7" x="14" y="14" rx="1"/>
                            <rect width="7" height="7" x="3" y="14" rx="1"/>
                        </svg>
                        <span>Products</span>
                    </button>
                    <button class="tab-btn" id="tab-wishlist" data-tab="wishlist" role="tab" aria-selected="false" aria-controls="content-area">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>
                        </svg>
                        <span>Wishlist</span>
                    </button>
                </nav>

                <!-- Theme Toggle -->
                <button class="theme-toggle" id="theme-toggle" aria-label="Toggle light/dark mode" title="Toggle theme">
                    <!-- Sun (shown in dark mode) -->
                    <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="4"/>
                        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
                    </svg>
                    <!-- Moon (shown in light mode) -->
                    <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
                    </svg>
                </button>
            </div>
        </header>

        <!-- Main Content Area -->
        <main class="app-main">
            <div id="content-area" class="content-area" role="tabpanel" aria-labelledby="tab-products">
                <div class="product-grid" id="product-grid">
                    <!-- Product cards will be rendered here dynamically -->
                </div>
            </div>
        </main>
    </div>

    <!-- Firebase SDK (modular, CDN) -->
    <script type="module" src="firebase.js"></script>
    <!-- Application Script -->
    <script type="module" src="app.js"></script>
</body>
</html>
